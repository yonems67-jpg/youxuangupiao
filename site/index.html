<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>每日选股</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #f5f5f5; }
    #status { color: #888; }
  </style>
</head>
<body>
  <h1>每日优选股票</h1>
  <p id="status">加载中...</p>
  <table>
    <thead><tr id="table-header"></tr></thead>
    <tbody id="table-body"></tbody>
  </table>

  <script>
    fetch('data/latest.json')
      .then(res => {
        if (!res.ok) {
          throw new Error('data/latest.json 请求失败,状态码 ' + res.status + '(文件可能还没生成,或路径不对)');
        }
        return res.json();
      })
      .then(data => {
        const statusEl = document.getElementById('status');
        const stocks = data.stocks || [];

        if (stocks.length === 0) {
          statusEl.textContent = '更新时间: ' + data.update_date + ' — 今天没有符合条件的股票';
          return;
        }

        statusEl.textContent = '更新时间: ' + data.update_date;

        const headerRow = document.getElementById('table-header');
        Object.keys(stocks[0]).forEach(key => {
          const th = document.createElement('th');
          th.textContent = key;
          headerRow.appendChild(th);
        });

        const tbody = document.getElementById('table-body');
        stocks.forEach(stock => {
          const tr = document.createElement('tr');
          Object.values(stock).forEach(val => {
            const td = document.createElement('td');
            td.textContent = val;
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
      })
      .catch(err => {
        document.getElementById('status').textContent = '加载失败: ' + err.message;
      });
  </script>
</body>
</html>
