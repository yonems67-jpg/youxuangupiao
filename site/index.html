<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#F8F9FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#090A0F" media="(prefers-color-scheme: dark)">
<title>每日优选 · 仪表盘</title>
<style>
  :root {
    --bg: #F4F5F8;
    --bg-gradient: radial-gradient(at 0% 0%, rgba(224, 231, 255, 0.4) 0px, transparent 50%),
                   radial-gradient(at 100% 100%, rgba(254, 243, 199, 0.3) 0px, transparent 50%);
    --surface: rgba(255, 255, 255, 0.85);
    --surface-solid: #FFFFFF;
    --ink: #0F172A;
    --muted: #64748B;
    --hairline: rgba(226, 232, 240, 0.8);
    
    --fortune: #B91C1C;
    --fortune-soft: rgba(185, 28, 28, 0.06);
    --gold: #D97706;
    --gold-soft: rgba(217, 119, 6, 0.08);
    --gold-border: rgba(217, 119, 6, 0.28);
    
    --up: #EF4444;
    --up-soft: rgba(239, 68, 68, 0.08);
    --down: #10B981;
    --down-soft: rgba(16, 185, 129, 0.08);
    --warn: #F59E0B;
    --warn-soft: rgba(245, 158, 11, 0.08);
    
    --header-bg: rgba(244, 245, 248, 0.8);
    --card-shadow: 0 4px 20px -2px rgba(0, 0, 0, 0.03), 0 2px 6px -1px rgba(0, 0, 0, 0.02);
    --radius-lg: 20px;
    --radius-md: 12px;
    --radius-sm: 8px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #090A0F;
      --bg-gradient: radial-gradient(at 0% 0%, rgba(30, 41, 59, 0.5) 0px, transparent 50%),
                     radial-gradient(at 100% 100%, rgba(67, 56, 202, 0.12) 0px, transparent 50%);
      --surface: rgba(22, 26, 36, 0.75);
      --surface-solid: #161A24;
      --ink: #F8FAFC;
      --muted: #94A3B8;
      --hairline: rgba(255, 255, 255, 0.08);
      
      --fortune: #F87171;
      --fortune-soft: rgba(248, 113, 113, 0.12);
      --gold: #FBBF24;
      --gold-soft: rgba(251, 191, 36, 0.12);
      --gold-border: rgba(251, 191, 36, 0.35);
      
      --up: #F87171;
      --up-soft: rgba(248, 113, 113, 0.12);
      --down: #34D399;
      --down-soft: rgba(52, 211, 153, 0.12);
      --warn: #FBBF24;
      --warn-soft: rgba(251, 191, 36, 0.12);
      
      --header-bg: rgba(9, 10, 15, 0.8);
      --card-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.36), inset 0 1px 0 0 rgba(255, 255, 255, 0.05);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    background-image: var(--bg-gradient);
    background-attachment: fixed;
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "PingFang SC", sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 60px;
  }

  .mono { font-family: "SF Mono", "JetBrains Mono", "Menlo", monospace; letter-spacing: -0.02em; }

  /* 顶部导航与时钟 */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 14px 24px;
    background: var(--header-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--hairline);
  }

  .header-container {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand { 
    font-size: 16px; 
    font-weight: 700; 
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, var(--ink) 30%, var(--muted));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .clock-wrap {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--muted);
    background: var(--surface);
    padding: 6px 12px;
    border-radius: 100px;
    border: 1px solid var(--hairline);
  }

  .live-dot { 
    width: 6px; height: 6px; border-radius: 50%; 
    background: var(--down); 
    box-shadow: 0 0 8px var(--down);
  }

  @media (prefers-reduced-motion: no-preference) {
    .live-dot { animation: pulse 2s ease-in-out infinite; }
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

  /* Tab 导航切页控制 */
  .nav-tabs-wrap {
    max-width: 960px;
    margin: 20px auto 0;
    padding: 0 20px;
  }

  .nav-tabs {
    display: flex;
    background: var(--surface);
    border: 1px solid var(--hairline);
    padding: 4px;
    border-radius: var(--radius-md);
    gap: 4px;
    backdrop-filter: blur(10px);
  }

  .tab-btn {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--muted);
    padding: 10px 12px;
    font-size: 13px;
    font-weight: 600;
    border-radius: calc(var(--radius-md) - 4px);
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
  }

  .tab-btn.active {
    background: var(--surface-solid);
    color: var(--ink);
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }

  /* 主内容区域与页面分屏 */
  main { max-width: 960px; margin: 0 auto; padding: 20px 20px 0; }

  .tab-page { display: none; }
  .tab-page.active { display: block; }

  /* 2列并列网格布局 (用于首页) */
  .grid-2col {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    align-items: start;
  }

  @media (max-width: 768px) {
    .grid-2col { grid-template-columns: 1fr; }
  }

  .card {
    background: var(--surface);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-lg);
    padding: 22px;
    margin-bottom: 16px;
    box-shadow: var(--card-shadow);
  }

  .card-label {
    font-size: 11px; color: var(--muted); font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 12px;
  }

  /* ---------- 今日运势 ---------- */
  .date-line { font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 4px; }
  .fortune-title { font-size: 24px; font-weight: 800; letter-spacing: -0.03em; margin: 0 0 18px; }

  .bazi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 18px; }
  .pillar {
    text-align: center; padding: 14px 6px 12px; border-radius: var(--radius-md);
    background: var(--surface-solid); border: 1px solid var(--hairline);
  }
  .pillar.day-master { 
    background: var(--gold-soft); 
    border-color: var(--gold-border);
  }
  .pillar-label { display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
  .pillar-char { display: block; font-size: 22px; font-weight: 700; line-height: 1.3; }
  .pillar.day-master .pillar-char:first-of-type { color: var(--gold); }

  .stat-strip {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px;
    margin-bottom: 18px; scrollbar-width: none;
  }
  .stat-strip::-webkit-scrollbar { display: none; }
  .stat-chip {
    flex: 0 0 auto; background: var(--surface-solid); border: 1px solid var(--hairline);
    border-radius: var(--radius-sm); padding: 8px 14px; font-size: 12px; color: var(--muted); white-space: nowrap;
  }
  .stat-chip b { color: var(--ink); font-weight: 600; margin-left: 2px; }

  .yiji-row { display: flex; gap: 16px; margin-bottom: 16px; }
  .yiji-col { flex: 1; min-width: 0; }
  .yiji-label { font-size: 12px; font-weight: 700; margin-bottom: 10px; letter-spacing: 0.05em; }
  .yiji-label.yi { color: var(--down); }
  .yiji-label.ji { color: var(--up); }
  .chip-wrap { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { font-size: 12px; font-weight: 500; padding: 5px 11px; border-radius: 100px; }
  .chip.yi { background: var(--down-soft); color: var(--down); }
  .chip.ji { background: var(--up-soft); color: var(--up); }
  .chip.more { background: var(--surface-solid); border: 1px solid var(--hairline); color: var(--muted); }

  .fortune-summary {
    font-size: 14px; line-height: 1.65; color: var(--ink); background: var(--fortune-soft);
    border-left: 3px solid var(--fortune); padding: 14px 16px;
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
  }

  /* ---------- 市场概览 ---------- */
  .market-top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px; }
  .market-score { font-size: 44px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; }
  .market-score-unit { font-size: 14px; font-weight: 600; color: var(--muted); }
  
  .market-sub { font-size: 13px; color: var(--muted); margin-bottom: 18px; display: flex; align-items: center; gap: 10px; }
  .market-sub b { color: var(--ink); font-weight: 600; }

  .status-badge {
    display: inline-flex; align-items: center; padding: 4px 10px; border-radius: 100px;
    font-size: 12px; font-weight: 700;
  }
  .status-badge.strong { background: var(--up-soft); color: var(--up); }
  .status-badge.oscillate { background: var(--gold-soft); color: var(--gold); }
  .status-badge.weak { background: var(--down-soft); color: var(--down); }

  .breadth-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .breadth-item {
    text-align: center; background: var(--surface-solid); border: 1px solid var(--hairline);
    border-radius: var(--radius-md); padding: 12px 6px;
  }
  .breadth-num { font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
  .breadth-label { font-size: 11px; font-weight: 500; color: var(--muted); margin-top: 4px; }

  /* ---------- 风险提示与回测 ---------- */
  .risk-card.warn { background: var(--warn-soft); border-color: rgba(245, 158, 11, 0.2); }
  .risk-card.ok { background: var(--surface); }
  .risk-title {
    font-size: 15px; font-weight: 700; margin-bottom: 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .risk-card.warn .risk-title { color: var(--warn); }
  .risk-card.ok .risk-title { color: var(--down); }
  .risk-note { font-size: 13px; line-height: 1.6; color: var(--ink); margin: 6px 0; }

  .backtest-empty { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0; }
  .backtest-tag {
    display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 8px; border-radius: 100px;
    background: var(--hairline); color: var(--muted); margin-left: 8px;
  }

  /* ---------- 股票列表 ---------- */
  .status-line { font-size: 12px; color: var(--muted); margin: 0 0 16px 4px; line-height: 1.5; }

  .stock-row {
    display: flex; align-items: center; padding: 14px 4px;
    border-bottom: 1px solid var(--hairline); gap: 12px;
  }
  .stock-row:last-child { border-bottom: none; }

  .rank { width: 20px; flex: 0 0 auto; font-size: 13px; font-weight: 700; color: var(--muted); text-align: center; }

  .stock-name { flex: 1; min-width: 0; }
  .stock-name .name-line { display: flex; align-items: baseline; gap: 8px; }
  .stock-name .name { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stock-name .code { font-size: 12px; color: var(--muted); font-weight: 500; }
  .stock-name .industry { font-size: 12px; color: var(--muted); margin-top: 2px; }

  .action-tag {
    display: inline-block; font-size: 11px; font-weight: 700; padding: 2px 8px;
    border-radius: 6px; margin-top: 6px;
  }
  .action-tag.focus { background: var(--fortune-soft); color: var(--fortune); }
  .action-tag.watch { background: var(--surface-solid); border: 1px solid var(--hairline); color: var(--muted); }
  .action-tag.caution { background: var(--warn-soft); color: var(--warn); }

  .stock-metrics { flex: 0 0 auto; text-align: right; }
  .stock-price { font-size: 16px; font-weight: 700; }
  .stock-change {
    display: inline-block; margin-top: 4px; font-size: 12px; font-weight: 700;
    padding: 3px 8px; border-radius: 6px;
  }
  .stock-change.up { background: var(--up-soft); color: var(--up); }
  .stock-change.down { background: var(--down-soft); color: var(--down); }

  .placeholder { font-size: 13px; color: var(--muted); line-height: 1.6; }

  /* ---------- 我的持仓 ---------- */
  .position-form {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
    background: var(--surface-solid);
    padding: 16px;
    border-radius: var(--radius-md);
    border: 1px solid var(--hairline);
  }
  .position-form input {
    font-family: inherit;
    font-size: 13px;
    padding: 10px 12px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--hairline);
    background: var(--bg);
    color: var(--ink);
    outline: none;
  }
  .position-form input::placeholder { color: var(--muted); }
  .position-form button {
    grid-column: 1 / -1;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    padding: 12px;
    border-radius: var(--radius-sm);
    border: none;
    background: var(--ink);
    color: var(--bg);
    cursor: pointer;
  }

  .position-item {
    padding: 16px 4px;
    border-bottom: 1px solid var(--hairline);
  }
  .position-item:last-child { border-bottom: none; }

  .position-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 6px;
  }
  .position-head .name { font-size: 16px; font-weight: 700; }
  .position-head .code { font-size: 12px; color: var(--muted); margin-left: 6px; }
  .position-del { 
    font-size: 12px; font-weight: 600; color: var(--muted); 
    background: none; border: none; padding: 4px 8px; cursor: pointer;
  }

  .position-meta { font-size: 12px; color: var(--muted); margin-bottom: 12px; }

  .position-price-row {
    display: flex; align-items: center; gap: 12px; margin-bottom: 12px;
  }
  .position-price-row input {
    width: 110px; font-family: "SF Mono", monospace; font-size: 14px; font-weight: 600;
    padding: 8px 10px; border-radius: var(--radius-sm); border: 1px solid var(--hairline);
    background: var(--surface-solid); color: var(--ink); outline: none;
  }
  .position-pnl { font-size: 14px; font-weight: 700; }
  .position-pnl.up { color: var(--up); }
  .position-pnl.down { color: var(--down); }

  .position-target-strip {
    display: flex; gap: 8px; overflow-x: auto; margin-bottom: 12px; scrollbar-width: none;
  }
  .position-target-strip::-webkit-scrollbar { display: none; }
  .target-chip {
    flex: 0 0 auto; font-size: 11px; padding: 6px 10px; border-radius: var(--radius-sm);
    background: var(--surface-solid); border: 1px solid var(--hairline); color: var(--muted); white-space: nowrap;
  }
  .target-chip b { color: var(--ink); font-weight: 700; }

  .position-verdict {
    font-size: 13px; font-weight: 500; line-height: 1.5; padding: 12px 14px;
    border-radius: var(--radius-sm); background: var(--surface-solid); border: 1px solid var(--hairline); color: var(--muted);
  }
  .position-verdict.fire-loss { background: var(--up-soft); border-color: transparent; color: var(--up); font-weight: 600; }
  .position-verdict.fire-profit { background: var(--down-soft); border-color: transparent; color: var(--down); font-weight: 600; }
  .position-verdict.fire-time { background: var(--warn-soft); border-color: transparent; color: var(--warn); font-weight: 600; }

  footer {
    max-width: 960px; margin: 24px auto 0; padding: 0 24px;
    font-size: 11px; line-height: 1.6; color: var(--muted); text-align: center; opacity: 0.8;
  }
</style>
</head>
<body>

<header>
  <div class="header-container">
    <div class="brand">每日优选 · 仪表盘</div>
    <div class="clock-wrap">
      <span class="live-dot"></span>
      <span id="clock" class="mono"></span>
    </div>
  </div>
</header>

<!-- Segments / Nav Tabs -->
<div class="nav-tabs-wrap">
  <nav class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('tab-overview', this)">📊 市场概览</button>
    <button class="tab-btn" onclick="switchTab('tab-stocks', this)">🔥 今日优选</button>
    <button class="tab-btn" onclick="switchTab('tab-positions', this)">💼 我的持仓</button>
    <button class="tab-btn" onclick="switchTab('tab-fortune', this)">🔮 玄学运势</button>
  </nav>
</div>

<main>

  <!-- Page 1: 市场概览 (首页) -->
  <div class="tab-page active" id="tab-overview">
    <div class="grid-2col">
      <!-- 市场概览卡片 -->
      <section class="card" id="market-card">
        <div class="card-label">市场指标</div>
        <div class="market-top">
          <div class="market-score mono" id="market-score">--</div>
          <div class="market-score-unit">/ 100</div>
        </div>
        <div id="market-status-wrap" class="market-sub">
          <span class="status-badge" id="status-badge">--</span>
          建议仓位 <b id="suggested-position">--</b>
        </div>
        <div class="breadth-grid" id="breadth-grid"></div>
      </section>

      <!-- 风险提示与回测卡片组 -->
      <div>
        <section class="card risk-card ok" id="risk-card">
          <div class="risk-title" id="risk-title">风险提示</div>
          <div id="risk-body"><p class="risk-note">加载中...</p></div>
        </section>

        <section class="card" id="backtest-card">
          <div class="card-label">策略回测<span class="backtest-tag">尚未接入</span></div>
          <p class="backtest-empty">
            回测引擎 (<code>scripts/backtest.py</code>) 已就绪，待接入历史数据。
          </p>
        </section>
      </div>
    </div>
  </div>

  <!-- Page 2: 今日优选股票 -->
  <div class="tab-page" id="tab-stocks">
    <p class="status-line" id="stock-status">加载中...</p>
    <section class="card" id="stock-card" style="padding: 8px 20px;">
      <div id="stock-list"></div>
    </section>
  </div>

  <!-- Page 3: 我的持仓 -->
  <div class="tab-page" id="tab-positions">
    <p class="status-line">数据存储于当前浏览器本地；卖出规则与 scripts/backtest.py 同步。</p>
    <section class="card" id="position-card">
      <div class="position-form">
        <input type="text" id="pos-input-name" placeholder="股票名称">
        <input type="text" id="pos-input-code" placeholder="代码,如 600000">
        <input type="number" id="pos-input-cost" placeholder="成本价" step="0.01">
        <input type="number" id="pos-input-shares" placeholder="数量(股)" step="100">
        <input type="date" id="pos-input-date">
        <button onclick="addPosition()">添加持仓</button>
      </div>
      <div id="position-list"></div>
    </section>
  </div>

  <!-- Page 4: 玄学运势 -->
  <div class="tab-page" id="tab-fortune">
    <section class="card" id="fortune-card">
      <div class="date-line" id="date-line">加载中...</div>
      <h1 class="fortune-title">今日运势</h1>
      <div id="fortune-body">
        <p class="placeholder">运势数据未接入，配置后展示八字与黄历分析。</p>
      </div>
    </section>
  </div>

</main>

<footer>
  数据每 15 分钟自动更新一次 · 市场评分基于全市场涨跌家数计算，不构成投资建议
</footer>

<script>
  // ---------- Tab 切换逻辑 ----------
  function switchTab(tabId, btn) {
    document.querySelectorAll('.tab-page').forEach(page => page.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    
    document.getElementById(tabId).classList.add('active');
    btn.classList.add('active');
  }

  // ---------- 实时时钟(北京时间)----------
  function updateClock() {
    const now = new Date();
    const formatted = new Intl.DateTimeFormat('zh-CN', {
      timeZone: 'Asia/Shanghai',
      hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    }).format(now);
    document.getElementById('clock').textContent = formatted + ' 北京时间';
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ---------- 市场概览 + 风险 + 股票列表(全部来自 latest.json)----------
  function renderMarket(market) {
    document.getElementById('market-score').textContent = market.market_score ?? '--';

    const badge = document.getElementById('status-badge');
    const statusMap = { '强势': 'strong', '震荡': 'oscillate', '弱势': 'weak' };
    badge.textContent = market.market_status ?? '--';
    badge.className = 'status-badge ' + (statusMap[market.market_status] || '');

    document.getElementById('suggested-position').textContent = market.suggested_position ?? '--';

    const items = [
      ['上涨', market.up_count, 'up'],
      ['下跌', market.down_count, 'down'],
      ['涨停', market.limit_up_count, 'up'],
      ['跌停', market.limit_down_count, 'down'],
    ];
    document.getElementById('breadth-grid').innerHTML = items.map(([label, val, cls]) => `
      <div class="breadth-item">
        <div class="breadth-num mono" style="color: var(--${cls})">${val ?? '--'}</div>
        <div class="breadth-label">${label}</div>
      </div>`).join('');
  }

  function renderRisk(risk) {
    const card = document.getElementById('risk-card');
    const title = document.getElementById('risk-title');
    const body = document.getElementById('risk-body');
    const hasWarning = risk.suggest_reduce_position;

    card.className = 'card risk-card ' + (hasWarning ? 'warn' : 'ok');
    title.textContent = hasWarning ? '风险提示 · 建议降低仓位' : '风险提示 · 暂无明显警示';

    if (risk.notes && risk.notes.length) {
      body.innerHTML = risk.notes.map(n => `<p class="risk-note">· ${n}</p>`).join('');
    } else {
      body.innerHTML = '<p class="risk-note">行业集中度与市场宽度目前都在正常范围内。</p>';
    }
  }

  function renderStocks(data) {
    const stocks = data.stocks || [];
    const statusEl = document.getElementById('stock-status');
    statusEl.textContent = '更新于 ' + (data.update_date || '--');

    const listEl = document.getElementById('stock-list');
    if (stocks.length === 0) {
      listEl.innerHTML = '<p class="placeholder" style="padding:12px 4px;">今天没有符合条件的股票</p>';
      return;
    }

    const actionCls = { '重点关注': 'focus', '观察': 'watch', '谨慎': 'caution' };

    listEl.innerHTML = stocks.map((s, i) => {
      const change = parseFloat(s['涨跌幅']);
      const isUp = change >= 0;
      const cls = isUp ? 'up' : 'down';
      const sign = isUp ? '+' : '';
      const action = s['操作建议'] || '';
      return `
        <div class="stock-row">
          <div class="rank mono">${i + 1}</div>
          <div class="stock-name">
            <div class="name-line">
              <span class="name">${s['名称'] ?? ''}</span>
              <span class="code mono">${s['代码'] ?? ''}</span>
            </div>
            <div class="industry">${s['行业'] ?? '未分类'}</div>
            ${action ? `<span class="action-tag ${actionCls[action] || 'watch'}">${action}</span>` : ''}
          </div>
          <div class="stock-metrics">
            <div class="stock-price mono">${s['最新价'] ?? '--'}</div>
            <div class="stock-change mono ${cls}">${sign}${isNaN(change) ? '--' : change.toFixed(2)}%</div>
          </div>
        </div>`;
    }).join('');
  }

  // ---------- 运势数据(独立于股票数据,来自 fortune.json)----------
  function renderFortune(data) {
    document.getElementById('date-line').textContent =
      (data.solar_date || '') + (data.lunar_date ? ' · ' + data.lunar_date : '');

    const b = data.bazi || {};
    const pillars = [
      { label: '年柱', value: b.year },
      { label: '月柱', value: b.month },
      { label: '日柱', value: b.day, isDayMaster: true },
      { label: '时柱', value: b.hour },
    ];

    const chip = (text, cls) => `<span class="chip ${cls}">${text}</span>`;
    const yijiList = (arr, cls) => {
      if (!arr || !arr.length) return '<span class="placeholder">暂无</span>';
      const shown = arr.slice(0, 6).map(t => chip(t, cls)).join('');
      const rest = arr.length > 6 ? chip('共' + arr.length + '项', 'more') : '';
      return `<div class="chip-wrap">${shown}${rest}</div>`;
    };

    let pillarsHtml = '';
    pillars.forEach(p => {
      if (!p.value) return;
      pillarsHtml += `
        <div class="pillar${p.isDayMaster ? ' day-master' : ''}">
          <span class="pillar-label">${p.label}</span>
          <span class="pillar-char">${p.value.charAt(0)}</span>
          <span class="pillar-char">${p.value.slice(1)}</span>
        </div>`;
    });

    const stats = [['纳音', data.nayin], ['值神', data.day_officer], ['廿八宿', data.star_28], ['生肖', data.zodiac]]
      .filter(([, v]) => v);
    const statsHtml = stats.map(([k, v]) => `<div class="stat-chip">${k} <b>${v}</b></div>`).join('');

    document.getElementById('fortune-body').innerHTML = `
      ${pillarsHtml ? `<div class="bazi-grid">${pillarsHtml}</div>` : ''}
      ${statsHtml ? `<div class="stat-strip">${statsHtml}</div>` : ''}
      <div class="yiji-row">
        <div class="yiji-col"><div class="yiji-label yi">宜</div>${yijiList(data.good_things, 'yi')}</div>
        <div class="yiji-col"><div class="yiji-label ji">忌</div>${yijiList(data.bad_things, 'ji')}</div>
      </div>
      ${data.fortune_summary ? `<p class="fortune-summary">${data.fortune_summary}</p>` : ''}
    `;
  }

  function loadFortune() {
    fetch('data/fortune.json', { cache: 'no-store' })
      .then(res => { if (!res.ok) throw new Error('status ' + res.status); return res.json(); })
      .then(renderFortune)
      .catch(() => { /* 数据还没生成之前保持占位提示 */ });
  }

  // ---------- 我的持仓 ----------
  const POSITIONS_KEY = 'myPositions';

  const SELL_RULES = {
    stopLossPct: -0.05,
    takeProfitTier1Pct: 0.08,
    takeProfitTier1Fraction: 0.5,
    takeProfitTier2Pct: 0.15,
    maxHoldingDays: 10,
  };

  let latestStocksByCode = {};

  function loadPositions() {
    try {
      return JSON.parse(localStorage.getItem(POSITIONS_KEY) || '[]');
    } catch (e) {
      return [];
    }
  }

  function savePositions(positions) {
    localStorage.setItem(POSITIONS_KEY, JSON.stringify(positions));
  }

  function addPosition() {
    const name = document.getElementById('pos-input-name').value.trim();
    const code = document.getElementById('pos-input-code').value.trim();
    const cost = parseFloat(document.getElementById('pos-input-cost').value);
    const shares = parseFloat(document.getElementById('pos-input-shares').value) || 0;
    const buyDate = document.getElementById('pos-input-date').value || new Date().toISOString().slice(0, 10);

    if (!name || !code || isNaN(cost) || cost <= 0) {
      alert('请至少填写名称、代码和成本价');
      return;
    }

    const positions = loadPositions();
    positions.push({ id: Date.now(), name, code, cost, shares, buyDate, currentPrice: null });
    savePositions(positions);

    ['pos-input-name', 'pos-input-code', 'pos-input-cost', 'pos-input-shares'].forEach(id => {
      document.getElementById(id).value = '';
    });

    renderPositions();
  }

  function deletePosition(id) {
    savePositions(loadPositions().filter(p => p.id !== id));
    renderPositions();
  }

  function updatePositionPrice(id, value) {
    const price = parseFloat(value);
    const positions = loadPositions();
    const pos = positions.find(p => p.id === id);
    if (pos) {
      pos.currentPrice = isNaN(price) ? null : price;
      savePositions(positions);
      renderPositions();
    }
  }

  function analyzePosition(pos) {
    const cost = pos.cost;
    const targets = {
      stopLoss: cost * (1 + SELL_RULES.stopLossPct),
      tp1: cost * (1 + SELL_RULES.takeProfitTier1Pct),
      tp2: cost * (1 + SELL_RULES.takeProfitTier2Pct),
    };

    const holdingDays = Math.max(0, Math.floor((new Date() - new Date(pos.buyDate)) / (1000 * 60 * 60 * 24)));
    let verdict = { text: '暂无规则触发,继续持有', cls: '' };
    let pnlPct = null;

    if (pos.currentPrice != null && !isNaN(pos.currentPrice)) {
      pnlPct = (pos.currentPrice - cost) / cost;

      if (pnlPct <= SELL_RULES.stopLossPct) {
        verdict = { text: `已触及止损线(浮亏${(pnlPct * 100).toFixed(1)}%),按规则应清仓离场`, cls: 'fire-loss' };
      } else if (pnlPct >= SELL_RULES.takeProfitTier2Pct) {
        verdict = { text: `已达止盈第二档(盈利${(pnlPct * 100).toFixed(1)}%),按规则应清仓剩余仓位`, cls: 'fire-profit' };
      } else if (pnlPct >= SELL_RULES.takeProfitTier1Pct) {
        verdict = { text: `已达止盈第一档(盈利${(pnlPct * 100).toFixed(1)}%),按规则应卖出50%,剩余继续持有`, cls: 'fire-profit' };
      } else if (holdingDays >= SELL_RULES.maxHoldingDays && pnlPct <= 0) {
        verdict = { text: `已持有${holdingDays}个自然日仍未见明显收益,按规则可考虑离场`, cls: 'fire-time' };
      }
    } else if (holdingDays >= SELL_RULES.maxHoldingDays) {
      verdict = { text: `已持有${holdingDays}个自然日,填一下现价能看更完整的分析`, cls: 'fire-time' };
    }

    return { targets, holdingDays, pnlPct, verdict };
  }

  function renderPositions() {
    const positions = loadPositions();
    const listEl = document.getElementById('position-list');

    if (positions.length === 0) {
      listEl.innerHTML = '<p class="placeholder" style="padding:12px 4px;">还没有添加持仓,填写上面的表单添加</p>';
      return;
    }

    listEl.innerHTML = positions.map(pos => {
      const liveMatch = latestStocksByCode[pos.code];
      if (liveMatch && pos.currentPrice == null) {
        pos.currentPrice = parseFloat(liveMatch['最新价']);
      }

      const { targets, holdingDays, pnlPct, verdict } = analyzePosition(pos);
      const pnlHtml = pnlPct != null
        ? `<span class="position-pnl mono ${pnlPct >= 0 ? 'up' : 'down'}">${pnlPct >= 0 ? '+' : ''}${(pnlPct * 100).toFixed(2)}%</span>`
        : '<span class="placeholder">填现价看盈亏</span>';

      return `
        <div class="position-item">
          <div class="position-head">
            <div><span class="name">${pos.name}</span><span class="code mono">${pos.code}</span></div>
            <button class="position-del" onclick="deletePosition(${pos.id})">删除</button>
          </div>
          <div class="position-meta">成本 ${pos.cost} × ${pos.shares || '--'}股 · 买入于 ${pos.buyDate} · 已持有 ${holdingDays} 个自然日</div>
          <div class="position-price-row">
            <input type="number" step="0.01" placeholder="现价" value="${pos.currentPrice ?? ''}"
              onchange="updatePositionPrice(${pos.id}, this.value)">
            ${pnlHtml}
          </div>
          <div class="position-target-strip">
            <div class="target-chip">止损价 <b class="mono">${targets.stopLoss.toFixed(2)}</b></div>
            <div class="target-chip">止盈价1(卖50%) <b class="mono">${targets.tp1.toFixed(2)}</b></div>
            <div class="target-chip">止盈价2(清仓) <b class="mono">${targets.tp2.toFixed(2)}</b></div>
          </div>
          <div class="position-verdict ${verdict.cls}">${verdict.text}</div>
        </div>`;
    }).join('');

    savePositions(positions);
  }

  document.getElementById('pos-input-date').valueAsDate = new Date();

  function loadAll() {
    loadFortune();
    const statusEl = document.getElementById('stock-status');
    fetch('data/latest.json', { cache: 'no-store' })
      .then(res => {
        if (!res.ok) throw new Error('data/latest.json 请求失败,状态码 ' + res.status);
        return res.json();
      })
      .then(data => {
        if (data.market) renderMarket(data.market);
        if (data.risk) renderRisk(data.risk);
        renderStocks(data);

        latestStocksByCode = {};
        (data.stocks || []).forEach(s => { latestStocksByCode[s['代码']] = s; });
        renderPositions();
      })
      .catch(err => { statusEl.textContent = '加载失败: ' + err.message; });
  }

  renderPositions();
  loadAll();
  setInterval(loadAll, 15 * 60 * 1000);
</script>

</body>
</html>
