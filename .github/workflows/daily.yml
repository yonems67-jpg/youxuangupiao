name: Daily Stock Selection

on:
  schedule:
    - cron: '*/15 * * * *'  # 每 15 分钟跑一次(UTC 时间,GitHub 会自动按此间隔触发)
  workflow_dispatch:      # 允许在 Actions 页面手动点击立即运行

jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run selection script
        run: python scripts/select_stocks.py

      - name: Run fortune script
        run: python scripts/fortune.py

      - name: Check output file
        run: |
          echo "=== 检查生成的文件 ==="
          ls -la site/data/ || echo "!!! site/data 目录不存在 !!!"
          cat site/data/latest.json || echo "!!! latest.json 不存在或读取失败 !!!"
          cat site/data/fortune.json || echo "!!! fortune.json 不存在或读取失败 !!!"

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f site/data/latest.json site/data/fortune.json
          git status
          if git diff --staged --quiet; then
            echo "没有变化,跳过 commit"
          else
            git commit -m "Update stock picks $(date +'%Y-%m-%d')"
            git push origin HEAD:main
            echo "已 commit 并 push"
          fi
